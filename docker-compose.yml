services:
  # ==========================================
  # BROKERS
  # ==========================================
  broker-a:
    build: { context: ., dockerfile: Dockerfile.broker }
    environment:
      BROKER_ID: "A"
      PORTA: "5001"
      PEERS: "broker-b:5002,broker-c:5003,broker-d:5004,broker-e:5005"
    ports: ["5001:5001"]

  broker-b:
    build: { context: ., dockerfile: Dockerfile.broker }
    environment:
      BROKER_ID: "B"
      PORTA: "5002"
      PEERS: "broker-a:5001,broker-c:5003,broker-d:5004,broker-e:5005"
    ports: ["5002:5002"]

  broker-c:
    build: { context: ., dockerfile: Dockerfile.broker }
    environment:
      BROKER_ID: "C"
      PORTA: "5003"
      PEERS: "broker-a:5001,broker-b:5002,broker-d:5004,broker-e:5005"
    ports: ["5003:5003"]

  broker-d:
    build: { context: ., dockerfile: Dockerfile.broker }
    environment:
      BROKER_ID: "D"
      PORTA: "5004"
      PEERS: "broker-a:5001,broker-b:5002,broker-c:5003,broker-e:5005"
    ports: ["5004:5004"]

  broker-e:
    build: { context: ., dockerfile: Dockerfile.broker }
    environment:
      BROKER_ID: "E"
      PORTA: "5005"
      PEERS: "broker-a:5001,broker-b:5002,broker-c:5003,broker-d:5004"
    ports: ["5005:5005"]

  # ==========================================
  # DRONES (Ajustados com ADDR: 0.0.0.0)
  # ==========================================
  drone-1:
    build: { context: ., dockerfile: Dockerfile.drone }
    environment:
      DRONE_ID: "drone-1"
      PORTA: "6001"
      ADDR: "drone-1"
      BROKERS: "broker-a:5001,broker-b:5002,broker-c:5003,broker-d:5004,broker-e:5005"
    ports: ["6001:6001"]

  drone-2:
    build: { context: ., dockerfile: Dockerfile.drone }
    environment:
      DRONE_ID: "drone-2"
      PORTA: "6002"
      ADDR: "drone-2"
      BROKERS: "broker-a:5001,broker-b:5002,broker-c:5003,broker-d:5004,broker-e:5005"
    ports: ["6002:6002"]

  drone-3:
    build: { context: ., dockerfile: Dockerfile.drone }
    environment:
      DRONE_ID: "drone-3"
      PORTA: "6003"
      ADDR: "drone-3"
      BROKERS: "broker-a:5001,broker-b:5002,broker-c:5003,broker-d:5004,broker-e:5005"
    ports: ["6003:6003"]

  drone-4:
    build: { context: ., dockerfile: Dockerfile.drone }
    environment:
      DRONE_ID: "drone-4"
      PORTA: "6004"
      ADDR: "drone-4"
      BROKERS: "broker-a:5001,broker-b:5002,broker-c:5003,broker-d:5004,broker-e:5005"
    ports: ["6004:6004"]

  drone-5:
    build: { context: ., dockerfile: Dockerfile.drone }
    profiles: ["extra"] 
    environment:
      DRONE_ID: "drone-5"
      PORTA: "6005"
      ADDR: "0.0.0.0"
      BROKERS: "broker-a:5001,broker-b:5002,broker-c:5003,broker-d:5004,broker-e:5005"
    ports: ["6005:6005"]

  # ==========================================
  # SENSORES
  # ==========================================
  sensor-a:
    build: { context: ., dockerfile: Dockerfile.sensor }
    environment: { SETOR_ID: "A", BROKER_ADDR: "broker-a:5001", INTERVALO_MS: "12000" }
    depends_on: [broker-a]

  sensor-b:
    build: { context: ., dockerfile: Dockerfile.sensor }
    environment: { SETOR_ID: "B", BROKER_ADDR: "broker-b:5002", INTERVALO_MS: "15000" }
    depends_on: [broker-b]

  sensor-c:
    build: { context: ., dockerfile: Dockerfile.sensor }
    environment: { SETOR_ID: "C", BROKER_ADDR: "broker-c:5003", INTERVALO_MS: "14000" }
    depends_on: [broker-c]

  sensor-d:
    build: { context: ., dockerfile: Dockerfile.sensor }
    environment: { SETOR_ID: "D", BROKER_ADDR: "broker-d:5004", INTERVALO_MS: "18000" }
    depends_on: [broker-d]

  sensor-e:
    build: { context: ., dockerfile: Dockerfile.sensor }
    environment: { SETOR_ID: "E", BROKER_ADDR: "broker-e:5005", INTERVALO_MS: "16000" }
    depends_on: [broker-e]